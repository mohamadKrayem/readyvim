# ============================================================================
#  tmux configuration — standalone (no oh-my-tmux)
#  Dark theme, seamless nvim navigation, ASCII-safe (no Nerd Font required).
#  Reload after editing:  prefix + r
# ============================================================================

# ---- General ---------------------------------------------------------------
set  -g default-terminal "tmux-256color"
set  -ag terminal-overrides ",*256col*:RGB"   # 24-bit truecolor (for nvim)
set  -g  history-limit 50000
set  -g  mouse on
set  -s  escape-time 10                        # fast key sequences (nvim <Esc>)
set  -sg repeat-time 600                        # window for -r repeatable keys
set  -g  focus-events on
set  -g  base-index 1                           # windows numbered from 1
setw -g  pane-base-index 1                       # panes numbered from 1
set  -g  renumber-windows on                     # keep numbering gapless
set  -g  set-titles on
set  -g  display-time 1500
setw -g  mode-keys vi                             # vi keys in copy mode

# ---- Prefix: Ctrl-b (primary) + Ctrl-a (secondary) ------------------------
set -g prefix  C-b
set -g prefix2 C-a
bind C-a send-prefix -2

# ---- Reload config ---------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---- Sessions (same keys as oh-my-tmux) -----------------------------------
bind C-c new-session                                       # create a new session
bind C-f command-prompt -p find-session 'switch-client -t %%'  # jump to session by name

# ---- Splits (same keys as oh-my-tmux) -------------------------------------
bind - split-window -v -c "#{pane_current_path}"   # split horizontally (stacked)
bind _ split-window -h -c "#{pane_current_path}"   # split vertically (side by side)
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Pane navigation / move (same keys as oh-my-tmux) ---------------------
bind -r h select-pane -L   # move left
bind -r j select-pane -D   # move down
bind -r k select-pane -U   # move up
bind -r l select-pane -R   # move right
bind  >  swap-pane -D       # swap pane with the next one
bind  <  swap-pane -U       # swap pane with the previous one

# ---- Pane resizing (same keys as oh-my-tmux) ------------------------------
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind  +  resize-pane -Z     # maximize / zoom current pane

# ---- Window navigation & migration (same keys as oh-my-tmux) --------------
unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind -r C-S-H swap-window -t -1 \; select-window -t -1   # move window left
bind -r C-S-L swap-window -t +1 \; select-window -t +1   # move window right
bind Tab last-window

# ---- vim-tmux-navigator: seamless nvim split <-> tmux pane navigation ------
# Ctrl+h/j/k/l moves across nvim splits AND tmux panes transparently.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# ---- Copy mode (vi-style) --------------------------------------------------
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Ctrl-p / Ctrl-n: jump 8 lines up / down (like 8k / 8j in vim)
bind -T copy-mode-vi C-p send -X -N 8 cursor-up
bind -T copy-mode-vi C-n send -X -N 8 cursor-down
bind P paste-buffer

# ============================================================================
#  Productivity extras
# ============================================================================

# ---- System clipboard ------------------------------------------------------
# Copy (y in copy-mode, or mouse drag) goes to the OS clipboard.
# Works on macOS (pbcopy), Wayland (wl-copy), or X11 (xclip) automatically.
set -g set-clipboard on
if-shell "command -v pbcopy" {
  bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
}
if-shell "command -v wl-copy" {
  bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "wl-copy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
}
if-shell "command -v xclip" {
  bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
}

# ---- Floating popups (tmux 3.2+) ------------------------------------------
# Scratch shell that opens in the current directory, then vanishes.
bind t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "$SHELL"
# lazygit in a floating window (only bound if lazygit is installed).
if-shell "command -v lazygit" {
  bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
}
# Edit this config quickly (reload with prefix + r afterwards).
bind e display-popup -w 80% -h 80% -E "\${EDITOR:-nvim} ~/.tmux.conf"

# ---- Multi-pane helpers ----------------------------------------------------
# Toggle "type into every pane at once" (great for running the same command).
bind S set-window-option synchronize-panes \; display "sync-panes #{?pane_synchronized,ON,OFF}"
# Renumber windows to close gaps (1 2 4 -> 1 2 3).
bind R move-window -r \; display "windows renumbered"
# Clear screen + scrollback (Ctrl-l is used for pane nav, so it lives here).
bind C-k send-keys "clear" Enter \; clear-history \; display "cleared"

# ---- Quality of life -------------------------------------------------------
setw -g aggressive-resize on   # resize to the largest client actually viewing
set  -g detach-on-destroy off  # closing a session jumps to another, not exit

# ---- Pane titles on the border (opt-in) ------------------------------------
# Uncomment to label each pane with its number + running command:
# set -g pane-border-status top
# set -g pane-border-format " #P: #{pane_current_command} "

# ============================================================================
#  Theme — dark (soft black / blue accent / gray). Colors match the nvim side.
# ============================================================================
set -g status-position bottom
set -g status-interval 5
set -g status-justify  left

# Status bar background / default text
set -g status-style "bg=#1c1c1c,fg=#9e9e9e"

# Left: session name in a blue block
set -g status-left "#[bg=#5fafd7,fg=#1c1c1c,bold] #S #[bg=#1c1c1c,fg=#5fafd7,nobold]"
set -g status-left-length 30

# Right: date, time, hostname
set -g status-right "#[fg=#9e9e9e] %d %b  %H:%M #[bg=#3a3a3a,fg=#e4e4e4] #h "
set -g status-right-length 60

# Windows: current one highlighted blue, others muted
setw -g window-status-format         "#[fg=#9e9e9e] #I #W "
setw -g window-status-current-format "#[bg=#5fafd7,fg=#1c1c1c,bold] #I #W "
setw -g window-status-separator      ""
setw -g window-status-activity-style "fg=#5fafd7"

# Panes
set -g pane-border-style        "fg=#3a3a3a"
set -g pane-active-border-style "fg=#5fafd7"

# Command / message line
set -g message-style         "bg=#5fafd7,fg=#1c1c1c,bold"
set -g message-command-style "bg=#1c1c1c,fg=#5fafd7,bold"

# Copy-mode selection
setw -g mode-style "bg=#5fafd7,fg=#1c1c1c"

# Activity monitoring (subtle, no popups)
setw -g monitor-activity on
set  -g visual-activity  off
